<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Login Admin — Bantuin.aja</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="auth-brand">
        <img src="assets/images/logo-bantuin-aja.png" class="brand-logo" alt="Bantuin.aja">
      </a>
      <div class="auth-header">
        <h2>Login Admin</h2>
        <p>Masuk untuk mengakses dashboard admin</p>
      </div>

      <div class="auth-alert error" id="loginAlert" style="display: none;"></div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminEmail">Email</label>
          <input type="email" id="adminEmail" name="email" placeholder="nama@email.com" required>
        </div>
        <div class="form-group">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-auth">Masuk</button>
      </form>

      <p class="auth-note">
        Akun admin dibuat oleh admin master. Jika email belum dikonfirmasi,
        konfirmasi dulu lewat link di inbox atau Supabase → Authentication → Users.
      </p>

      <div class="auth-footer">
        <a href="index.html">← Kembali ke Beranda</a>
      </div>
    </div>
  </div>

  <script src="config/supabase.js"></script>
  <script src="js/main.js"></script>
  <script src="js/login_admin.js"></script>
</body>
</html>
